<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Spinwright: a play-money slot game with a tested math engine. No real money." />
    <title>Spinwright</title>
  </head>
  <body data-state="loading">
    <main class="app">
      <header class="top">
        <h1>Spinwright</h1>
        <p class="badge">Play money only</p>
      </header>

      <section class="stage" id="stage" aria-label="Slot machine"></section>

      <p id="message" class="message" role="status" aria-live="polite">Loading…</p>

      <section class="hud" aria-label="Controls">
        <div class="stat">
          <span class="label">Balance</span>
          <output id="balance" class="value">0</output>
        </div>

        <div class="stat bet">
          <span class="label" id="bet-label">Bet per line</span>
          <div class="stepper" role="group" aria-labelledby="bet-label">
            <button id="bet-down" type="button" aria-label="Lower bet">−</button>
            <output id="line-bet" class="value">1</output>
            <button id="bet-up" type="button" aria-label="Raise bet">+</button>
          </div>
          <span class="sub">Total bet <output id="total-bet">20</output></span>
        </div>

        <div class="stat">
          <span class="label">Win</span>
          <output id="win" class="value win">0</output>
        </div>

        <button id="spin" class="spin" type="button" disabled>SPIN</button>

        <label class="toggle">
          <input id="turbo" type="checkbox" />
          <span>Turbo</span>
        </label>
      </section>

      <div id="broke" class="broke" hidden>
        <p>You're out of credits. They're play money, so here are some more.</p>
        <button id="refill" type="button">Get free credits</button>
      </div>

      <footer class="footer">
        <p>Play money only. No real-money gambling, no payments, no accounts.</p>
        <p>Built with <span id="built-with"></span>.</p>
      </footer>
    </main>
    <noscript><p class="message">Spinwright needs JavaScript to run.</p></noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
