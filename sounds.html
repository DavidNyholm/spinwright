<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spinwright sounds</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; padding: 24px; background: #0b0a09; color: #efe6d5; font-family: system-ui, sans-serif; line-height: 1.4; }
      h1 { font-size: 1.1rem; margin: 0 0 6px; }
      h2 { font-size: 0.8rem; margin: 28px 0 8px; letter-spacing: 0.14em; text-transform: uppercase; color: #c79a45; }
      p { margin: 0 0 12px; color: #9a8f7c; font-size: 0.88rem; max-width: 70ch; }
      .volume { display: flex; align-items: center; gap: 10px; margin: 14px 0 6px; color: #9a8f7c; font-size: 0.88rem; }
      table { border-collapse: collapse; width: 100%; max-width: 860px; }
      td { padding: 6px 10px 6px 0; border-bottom: 1px solid #1c1814; font-size: 0.88rem; vertical-align: middle; }
      td.name { font-family: ui-monospace, Consolas, monospace; color: #f0d28a; white-space: nowrap; }
      td.stat { color: #9a8f7c; white-space: nowrap; font-variant-numeric: tabular-nums; }
      canvas { display: block; background: #060504; border-radius: 3px; }
      button { font: inherit; padding: 4px 12px; background: #1b1713; color: #efe6d5; border: 1px solid #6e4f1c; border-radius: 4px; cursor: pointer; }
      button:hover { border-color: #c79a45; }
      a { color: #c79a45; }
      .row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
    </style>
  </head>
  <body>
    <h1>Spinwright sounds</h1>
    <p>
      Development page. Every sound in the game is generated by code, so there are no audio files to license.
      Click anything to hear it. Each sound can also be downloaded as a WAV. Not part of the production build.
    </p>
    <label class="volume">Volume <input id="volume" type="range" min="0" max="100" value="60" /></label>
    <div id="root"></div>
    <script type="module" src="/src/soundsPage.ts"></script>
  </body>
</html>
